# 端到端示例：录像 + 你自己的跟踪脚本 -> 数据集 -> 人工标注 -> 冲突门禁 -> 重新训练
#
#   python app.py extract --config configs/reid.example.yaml
#   python app.py mine    --config configs/reid.example.yaml
#   python app.py         --config configs/reid.example.yaml     # 起标注网页
#
# 相对路径都相对本文件所在目录。所有键的默认值见 reid_annotation_tool/config.py。

dataset: /home/cxt/dataset/scene-reid


# ---------------------------------------------------------------- pipeline
# 目标检测、ID 分配、轨迹跟踪由你自己的脚本负责 —— 本工具不做这三件事，
# 它从你的跟踪结果里截取目标、按数据集结构组织、交给人工标注。
# script 可以是 .py 路径，也可以是随包附带的参考实现名。
# 本节的键**不做校验**：它们属于你的脚本，本工具无权定义。
pipeline:
  script: ultralytics
  detector: /home/cxt/dataset/human-head-detection/yolo11n.pt
  # 哪个类别成为身份；其余类别只用于否决被污染的裁剪
  class_ids: [0]
  neighbour_class_ids: [0]
  device: cuda:0
  imgsz: 1280
  conf: 0.35
  neighbour_conf: 0.10
  # 粗 ReID 模型只用于收紧关联，永远不产生标签；
  # appearance_recovery 保持关闭 —— 外观重连不构成“连续观测”这一证据
  reid_onnx: /home/cxt/projects/mobilenet-yolopose-plugin-pytorch/mobilenet-reid.onnx
  appearance_weight: 0.3
  appearance_recovery: false

# 已经有跟踪结果的话，换成这个即可，不需要任何模型：
# pipeline:
#   script: tracking_csv
#   file: /path/to/tracks.csv     # source,frame,track_id,x1,y1,x2,y2[,class_id,conf]


# ----------------------------------------------------------------- extract
extract:
  videos_dir: /home/cxt/projects/scene-source/recording
  pattern: "seg-*.mp4"
  frame_stride: 2
  # 轨迹连续多少个“已处理帧”没有再出现就算结束（由本工具判定，不由脚本判定）
  track_gap: 15

splits:
  # 划分按视频分配，因此同一个目标不会同时出现在 train 和 val
  split_ratios: [0.7, 0.15, 0.15]
  timestamp_regex: 'seg-(\d{8})-(\d{6})\.mp4'
  timestamp_source: filename
  timestamp_format: "%Y%m%d%H%M%S"
  # 录像形如 cam16/2026-08-30/210002.mp4 时改用完整路径匹配：
  # timestamp_regex: '(\d{4})-(\d{2})-(\d{2})/(\d{6})\.mp4$'
  # timestamp_source: path
  # video_id_regex: '(cam\d+)/(\d{4}-\d{2}-\d{2})/(\d{6})\.mp4$'
  # day_split: [20260828=train, 20260829=val, 20260830=test]


# -------------------------------------------------------------- projection
# 头→身体裁剪几何。始终生效，没有关闭开关：两种几何产出的数据集不可互换。
# 默认值是生产环境的实测标定值，换相机必须自己测。
projection:
  projection_space: [1200.0, 538.0]
  seam_x: 600.0
  nadir_left: [587.7, 455.2]
  nadir_right: [612.3, 455.2]
  extent_k: [1.0, 2.5, 5.0]
  extent_r_ref: 250.0


# ------------------------------------------------------------------- crops
# ⚠ max_neighbour_* 的默认值是按检出框调的，对投影身体框偏紧
#   （同段录像实测：头框几何拒 17.5%，身体框几何同阈值拒 45.3%）。按场景重标定。
crops:
  max_neighbour_iou: 0.10
  max_neighbour_contained: 0.35
  min_crop_side: 48
  min_blur: 60.0
  max_exposure_clip: 0.5
  sample_interval: 0.75
  max_track_crops: 12
  min_track_crops: 4

pairs:
  min_covisible_frames: 5
  max_covisible_iou: 0.05
  negative_ratio: 1.0


# -------------------------------------------------------------------- mine
mine:
  reid_onnx: /home/cxt/projects/mobilenet-yolopose-plugin-pytorch/mobilenet-reid.onnx
  splits: [train]                 # val/test 是不可扩充的受保护划分
  min_cosine: 0.80
  per_split: 200
  purity_per_split: 50
  # output_dir 留空则自动取下一轮 review/vN

serve:
  host: 0.0.0.0
  port: 8000


# ------------------------------------------------------------------- train
train:
  trainer: /home/cxt/projects/mobilenet-yolopose-plugin-pytorch
  python: /home/cxt/miniconda3/envs/aigc/bin/python
  name: scene_reviewed_v1
  backbone: osnet_x0_25
  pretrained_path: /home/cxt/projects/mobilenet-yolopose-plugin-pytorch/weights/pretrained/osnet_x0_25_msmt17.pth
  objective: id_triplet
  reid_epochs: 300
  export: true
  # pairs 留空则自动取最新的 pairs.reviewed-*.csv
