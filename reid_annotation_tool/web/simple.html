<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ReID 简化审核</title>
<style>
body{margin:16px;background:#15171b;color:#eee;font-family:system-ui,sans-serif}header{position:sticky;top:0;background:#15171b;padding:8px 0;z-index:2}article{border:1px solid #555;border-radius:8px;padding:12px;margin:14px 0;background:#202329}.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pics{display:flex;gap:6px;flex-wrap:wrap}.pics img{height:220px;max-width:160px;object-fit:contain;background:#080808}button{padding:10px 18px;margin:10px 8px 0 0;color:white;border:1px solid #777;border-radius:6px;background:#333;font-size:15px}.same{background:#17603a}.different{background:#792828}.unclear{background:#756319}.active{outline:4px solid #55aaff}.meta{color:#bbb;font-family:monospace;overflow-wrap:anywhere}.error{color:#ff7777}@media(max-width:700px){.pair{grid-template-columns:1fr}.pics img{height:180px;max-width:130px}}
</style>
</head>
<body>
<header><h2>ReID 简化审核页</h2><div id="status">正在读取候选……</div></header>
<main id="cards"><p>如果这里长时间没有内容，请强制刷新页面。</p></main>
<script>
const cards=document.getElementById('cards'),statusNode=document.getElementById('status');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pics=xs=>(xs||[]).map(x=>'<img loading="lazy" src="/files/'+encodeURI(x)+'">').join('');
function render(r){return '<article id="'+esc(r.candidate_id)+'"><div class="meta">'+esc(r.candidate_id)+' · distance '+esc(r.distance||r.cosine||'-')+' · gap '+esc(r.time_gap_sec||'-')+'s</div><div class="pair"><section><h3>'+esc(r.person_id1)+'</h3><div class="pics">'+pics(r.gallery1)+'</div></section><section><h3>'+esc(r.person_id2)+'</h3><div class="pics">'+pics(r.gallery2)+'</div></section></div><button class="same '+(r.review_label==='same'?'active':'')+'" onclick="save(\''+esc(r.candidate_id)+'\',\'same\')">同一人</button><button class="different '+(r.review_label==='different'?'active':'')+'" onclick="save(\''+esc(r.candidate_id)+'\',\'different\')">不同人</button><button class="unclear '+(r.review_label==='unclear'?'active':'')+'" onclick="save(\''+esc(r.candidate_id)+'\',\'unclear\')">无法判断</button></article>'}
async function load(){try{const [x,s]=await Promise.all([fetch('/api/candidates?status=pending&limit=20',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}),fetch('/api/state',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()})]);cards.innerHTML=x.rows.map(render).join('')||'<p>全部候选已经标记完成。</p>';statusNode.textContent='已完成 '+s.labelled+' / '+s.total+'；剩余 '+s.pending+' 条。每次显示接下来的 20 条，点击后自动补充。'}catch(e){cards.innerHTML='<p class="error">加载失败：'+esc(e.message)+'</p>';statusNode.textContent='API 连接失败';}}
async function save(id,label){try{const r=await fetch('/api/label',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({candidate_id:id,review_label:label})});if(!r.ok)throw Error(r.status);await load()}catch(e){alert('保存失败：'+e.message)}}
load();
</script>
</body></html>
